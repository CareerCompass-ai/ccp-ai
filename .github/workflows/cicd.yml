name: CI/CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ./dep/requirements.txt ]; then pip install -r ./dep/requirements.txt; fi
      - name: Build Docker Image
        run: |
          docker build -t ccp-ai .
      - name: Login to Docker Registry
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Push Docker Image to Registry
        run: |
          docker tag ccp-ai:latest ${{ secrets.DOCKER_USERNAME }}/ccp-ai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ccp-ai:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            ssh-keyscan -H ${{ secrets.SERVER }} >> ~/.ssh/known_hosts
            docker pull ${{ secrets.DOCKER_USERNAME }}/ccp-ai:latest
            docker stop ccp-ai || true
            docker rm ccp-ai || true
            docker run --name ccp-ai -d -p 5010:5010 ${{ secrets.DOCKER_USERNAME }}/ccp-ai:latest
