version: "3.7"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    env_file:
      - .base.env
    # healthcheck:
    #   test: echo srvr | nc zookeeper 2181 || exit 1
    #   start_period: 10s
    #   retries: 20
    #   interval: 10s
    networks:
      ccp_network:

  broker:
    image: confluentinc/cp-kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "29092:29092"
      - "9092:9092"
      - "9101:9101"
    env_file:
      - .base.env
    depends_on:
      - zookeeper
    # healthcheck:
    #   test: nc -z localhost 9092 || exit -1
    #   start_period: 15s
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10
    networks:
      ccp_network:

  control-center:
    image: confluentinc/cp-enterprise-control-center:latest
    hostname: control-center
    container_name: control-center
    depends_on:
      - broker
      - debezium
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "broker:29092"
      CONTROL_CENTER_CONNECT_CONNECT1_CLUSTER: "http://connect:8083"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLIENT_METRICS_ENABLE: "false"
      PORT: 9021
    networks:
      ccp_network:
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:9021/health" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  debezium:
    image: debezium/connect:latest
    container_name: debezium
    hostname: debezium
    depends_on:
      - broker
      - ccp-db
    ports:
      - "8093:8083"
    env_file:
      - .base.env
    # healthcheck:
    #   test:
    #     [ 'CMD', 'curl', '--silent', '--fail', '-X', 'GET', 'http://localhost:8083/connectors', ]
    #   start_period: 10s
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      ccp_network:

  debezium-ui:
    image: debezium/debezium-ui:latest
    container_name: debezium-ui
    hostname: debezium-ui
    depends_on:
      - debezium
    ports:
      - "8080:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      ccp_network:

  ccp-db:
    image: postgres:16.1-alpine3.19
    container_name: ccp-db
    hostname: ccp-db
    restart: always
    command: ["postgres", "-c", "wal_level=logical"]
    env_file:
      - .base.env
    ports:
      - 5432:5432
    networks:
      ccp_network:

  # qdrant:
  #   image: qdrant/qdrant:latest
  #   restart: always
  #   container_name: qdrant
  #   ports:
  #     - 6333:6333
  #     - 6334:6334
  #   expose:
  #     - 6333
  #     - 6334
  #     - 6335
  #   networks:
  #     ccp_network:

networks:
  ccp_network:
    name: ccp_network
    driver: bridge
